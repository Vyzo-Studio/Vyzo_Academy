name: Quality checks
on:
  push:
    branches: [main, feat-v13-subject-autocomplete, feat-v14-education-foundations, feat-v15-universal-pathways, release-v15-stage01-safe, feat-writing-lab-b1-secure-assessment, feat-writing-lab-b2-safe-editor-submit, feat-writing-lab-b3-secure-result-ui]
  pull_request:
    branches: [main, feat-writing-lab-a-proposals-editor, feat-writing-lab-b1-secure-assessment, feat-writing-lab-b2-safe-editor-submit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bank and JavaScript
        run: node tests/qa.mjs
      - name: Check HTML bundle
        run: python3 scripts/build.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser regression
        run: python3 tests/v6_browser.py
      - name: Validate V8 scheduler, diagnostics and RLS schema
        run: node tests/v8_core.test.mjs
      - name: Check V8 deployment guardrails
        run: python3 tests/v8_integration_check.py
      - name: Writing Lab A — conteúdo editorial, versões e funções puras
        run: |
          node --check academy/essay-lab.mjs
          node --check academy/essay-lab-ui.mjs
          node --check academy/app.mjs
          node tests/essay_lab_core.test.mjs
      - name: Browser regression V8 (simulated backend)
        run: python3 tests/browser_v8.py
      - name: 'Writing Lab A — Chromium: proposta, rascunho e recuperação'
        run: python3 tests/essay_lab_browser.py
      - name: Essay B1 — secure backend contract and mocked API
        run: |
          node --check supabase/functions/academy-essay-assess/assessment-policy.mjs
          node --check supabase/functions/academy-essay-assess/gateway.mjs
          node --check --input-type=module < supabase/functions/academy-essay-assess/index.ts
          node tests/essay_b1_backend.test.mjs
      - name: Essay B2 — editor submission and API contract (simulated Auth)
        run: |
          node --check academy/essay-assessment-client.mjs
          node --check academy/app.mjs
          node --check academy/essay-lab-ui.mjs
          node tests/essay_b2_client.test.mjs
          python3 tests/essay_b2_browser.py
      - name: Essay B3 — server-persisted results, safe rendering and recovery
        run: |
          node --check academy/essay-assessment-report.mjs
          node --check academy/app.mjs
          node tests/essay_b3_report.test.mjs
      - name: Public questionnaire demo browser test
        run: python3 tests/browser_demo.py

      - name: Verify V9 diagnostic and scheduler
        run: node tests/v9_core.test.mjs
      - name: V13 validated balanced question composition
        run: node tests/v13_composer.test.mjs
      - name: Verify V14 curricular matching and focused diagnostics
        run: node tests/v14_core.test.mjs
      - name: Validate curriculum taxonomy and Grade/Subject references
        run: |
          node --check academy/curriculum-taxonomy.mjs
          node --check academy/curriculo.mjs
          node --check academy/v15-pathways.mjs
          node --check academy/v9.mjs
          node tests/curriculum_taxonomy.test.mjs
      - name: Verify V15 school stages and content isolation
        run: node tests/v15_pathways.test.mjs
      - name: Gate safe V15 release (no auth, unreviewed pilots or cloud)
        run: node tests/v15_release_gate.test.mjs
      - name: Browser regression V9 (local storage simulated)
        run: python3 tests/v9_browser.py
      - name: Block 03/A — mobile navigation, focus and dark mode at 8 widths
        run: python3 tests/block03_v9_a11y_browser.py
      - name: Curriculum navigation browser (real Chromium)
        run: python3 tests/curriculum_browser.py
      - name: V15 school pathways and official past-paper browser tests
        run: python3 tests/v15_browser.py
      - name: V14 examination editing and timer browser regression
        run: python3 tests/v14_browser.py

      - name: Verify V10 research source validation
        run: node tests/v10_research.test.mjs
      - name: Browser regression V10 research and manual fallback
        run: python3 tests/v10_browser.py
      - name: Browser regression V10 candidate selection (simulated service)
        run: python3 tests/v10_search_browser.py
      - name: Check Edge Function JavaScript syntax
        run: node --check --input-type=module < supabase/functions/academy-exam-research/index.ts

      - name: V13 searchable subjects browser regression
        run: python3 tests/v13_subjects_browser.py
      - name: V13 30-question ENEM diagnostic browser
        run: python3 tests/v13_assessment_browser.py
